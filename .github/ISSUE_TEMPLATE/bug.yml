name: Something is broken
description: It does not work, or it works but wrongly
title: "[bug] "
labels: ["bug", "needs triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: How can we reproduce it?
    validations: { required: true }
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Distro and version, how you deployed, and your two network interfaces.
      placeholder: |
        Distro: Raspberry Pi OS on a Pi 5
        Uplink: built in ethernet
        Kids' side: USB ethernet adapter
    validations: { required: true }
  - type: textarea
    id: tests
    attributes:
      label: Do the test suites pass?
      description: |
        `sudo test/firewall-test.sh` and `sudo test/container-test.sh` are the
        useful two. Paste the summary lines. If they fail, that narrows it a lot.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "`docker logs genkan-gw` is usually the place to start. Please remove anything identifying."
      render: shell
